<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1eb">
  <title>FormaViva Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">FV</span><div><strong>FormaViva</strong><small>HOME</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><button id="themeButton" class="ghost">◐ Tema</button><div id="connection" class="connection">Connessione…</div></div>
    </aside>
    <main>
      <header>
        <div><p id="eyebrow">LA MIA CASA</p><h1 id="pageTitle">Panoramica</h1><p id="subtitle">Tutto sotto controllo, in un solo posto.</p></div>
        <div class="header-actions"><label class="search"><span>⌕</span><input id="search" placeholder="Cerca dispositivo"></label><button id="refresh" class="round" aria-label="Aggiorna">↻</button></div>
      </header>
      <section id="summary" class="summary"></section>
      <section><div class="section-head"><div><p class="label">IN EVIDENZA</p><h2 id="sectionTitle">Stato della casa</h2></div><span id="updated"></span></div><div id="cards" class="cards"></div></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
